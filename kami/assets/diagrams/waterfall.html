<!DOCTYPE html>
<!-- ==================================================================
     DIAGRAM · Waterfall Chart (kami palette)
     Revenue bridge / valuation decomposition / cash flow breakdown.
     Start value, positive/negative segments, end value.
     The <svg> below is generated by scripts/chart.py from the spec in its
     data-kami-spec attribute. To fill it, write the data as a spec and run
     `python3 scripts/build.py --chart spec.json -o chart.svg`; never edit
     coordinates by hand (--check-charts compares the marks to the spec).
     ================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waterfall Chart · kami diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment:    #f5f4ed;
    --ivory:        #faf9f5;
    --near-black:   #141413;
    --olive:        #504e49;
    --stone:        #6b6a64;
    --brand:        #1B365D;
    --brand-tint:   #EEF2F7;
    --border:       #e8e6dc;
    --positive:     #1B365D;
    --negative:     #6b6a64;
    --total:        #4d4c48;

    --serif: Charter, Georgia, Palatino, serif;
    --sans: var(--serif);
    --mono:  "JetBrains Mono", "SF Mono", Consolas, "TsangerJinKai02", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", monospace;
  }

  /* Poster-size page so WeasyPrint exports the full diagram without
     A4 clipping; browsers ignore @page. */
  @page { size: 1000px 940px; margin: 0; }

  body {
    font-family: var(--sans);
    background: var(--parchment);
    color: var(--near-black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 920px; width: 100%; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 500;
    letter-spacing: -0.3pt;
    line-height: 1.15;
    margin-bottom: 1.6rem;
  }

  svg { width: 100%; min-width: 640px; display: block; }

  .caption {
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--olive);
    margin-top: 1rem;
    max-width: 52ch;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Waterfall · kami diagram</p>
    <h1>{{Chart Title}}</h1>

    <svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" data-kami-chart="waterfall" data-kami-spec="{&quot;items&quot;:[{&quot;label&quot;:&quot;{{Start}}&quot;,&quot;total&quot;:true,&quot;value&quot;:120},{&quot;label&quot;:&quot;{{Cat A}}&quot;,&quot;value&quot;:30},{&quot;label&quot;:&quot;{{Cat B}}&quot;,&quot;value&quot;:20},{&quot;label&quot;:&quot;{{Cat C}}&quot;,&quot;value&quot;:-40},{&quot;label&quot;:&quot;{{Cat D}}&quot;,&quot;value&quot;:10},{&quot;label&quot;:&quot;{{Cat E}}&quot;,&quot;value&quot;:-20},{&quot;label&quot;:&quot;{{End}}&quot;,&quot;total&quot;:true}],&quot;type&quot;:&quot;waterfall&quot;}">
      <rect width="100%" height="100%" fill="#f5f4ed"/>
      <line x1="60" y1="320" x2="660" y2="320" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="324" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">0</text>
      <line x1="60" y1="250" x2="660" y2="250" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="254" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">50</text>
      <line x1="60" y1="180" x2="660" y2="180" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="184" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">100</text>
      <line x1="60" y1="110" x2="660" y2="110" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="114" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">150</text>
      <line x1="60" y1="40" x2="660" y2="40" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="44" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">200</text>
      <rect x="70.9" y="152" width="64" height="168" fill="#4d4c48" rx="2"/>
      <text x="102.9" y="144" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">120</text>
      <text x="102.9" y="340" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Start}}</text>
      <line x1="134.9" y1="152" x2="156.6" y2="152" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="156.6" y="110" width="64" height="42" fill="#1B365D" rx="2"/>
      <text x="188.6" y="102" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">+30</text>
      <text x="188.6" y="340" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat A}}</text>
      <line x1="220.6" y1="110" x2="242.3" y2="110" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="242.3" y="82" width="64" height="28" fill="#1B365D" rx="2"/>
      <text x="274.3" y="74" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">+20</text>
      <text x="274.3" y="340" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat B}}</text>
      <line x1="306.3" y1="82" x2="328" y2="82" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="328" y="82" width="64" height="56" fill="#6b6a64" rx="2"/>
      <text x="360" y="152" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">-40</text>
      <text x="360" y="340" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat C}}</text>
      <line x1="392" y1="138" x2="413.7" y2="138" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="413.7" y="124" width="64" height="14" fill="#1B365D" rx="2"/>
      <text x="445.7" y="116" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">+10</text>
      <text x="445.7" y="340" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat D}}</text>
      <line x1="477.7" y1="124" x2="499.4" y2="124" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="499.4" y="124" width="64" height="28" fill="#6b6a64" rx="2"/>
      <text x="531.4" y="166" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">-20</text>
      <text x="531.4" y="340" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat E}}</text>
      <line x1="563.4" y1="152" x2="585.1" y2="152" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="585.1" y="152" width="64" height="168" fill="#4d4c48" rx="2"/>
      <text x="617.1" y="144" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">120</text>
      <text x="617.1" y="340" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{End}}</text>
      <line x1="60" y1="368" x2="660" y2="368" stroke="#e8e7e1" stroke-width="0.8"/>
      <rect x="60" y="380" width="12" height="12" fill="#1B365D" rx="2"/>
      <text x="78" y="391" fill="#504e49" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">Increase</text>
      <rect x="154.8" y="380" width="12" height="12" fill="#6b6a64" rx="2"/>
      <text x="172.8" y="391" fill="#504e49" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">Decrease</text>
      <rect x="249.6" y="380" width="12" height="12" fill="#4d4c48" rx="2"/>
      <text x="267.6" y="391" fill="#504e49" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">Total</text>
    </svg>

    <p class="caption">{{Caption: e.g. "Revenue bridge from FY2024 to FY2025, showing growth drivers and headwinds."}}</p>
  </div>
</body>
</html>
