<!DOCTYPE html>
<!-- ==================================================================
     DIAGRAM · Line Chart (kami palette)
     Trend lines for time-series or ordered data (stock price, growth rate, etc.)
     Up to 12 points × 3 lines. Demo: 8 months × 2 lines.
     The <svg> below is generated by scripts/chart.py from the spec in its
     data-kami-spec attribute. To fill it, write the data as a spec and run
     `python3 scripts/build.py --chart spec.json -o chart.svg`; never edit
     coordinates by hand (--check-charts compares the marks to the spec).
     ================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Line Chart · kami diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment:    #f5f4ed;
    --ivory:        #faf9f5;
    --near-black:   #141413;
    --olive:        #504e49;
    --stone:        #6b6a64;
    --brand:        #1B365D;
    --brand-tint:   #EEF2F7;
    --border:       #e8e6dc;

    --serif: Charter, Georgia, Palatino, serif;
    --sans: var(--serif);
    --mono:  "JetBrains Mono", "SF Mono", Consolas, "TsangerJinKai02", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", monospace;
  }

  /* Poster-size page so WeasyPrint exports the full diagram without
     A4 clipping; browsers ignore @page. */
  @page { size: 1000px 960px; margin: 0; }

  body {
    font-family: var(--sans);
    background: var(--parchment);
    color: var(--near-black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 920px; width: 100%; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 500;
    letter-spacing: -0.3pt;
    line-height: 1.15;
    margin-bottom: 1.6rem;
  }

  svg { width: 100%; min-width: 640px; display: block; }

  .caption {
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--olive);
    margin-top: 1rem;
    max-width: 52ch;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line Chart · kami diagram</p>
    <h1>{{Chart Title}}</h1>

    <svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" data-kami-chart="line" data-kami-spec="{&quot;categories&quot;:[&quot;Jan&quot;,&quot;Feb&quot;,&quot;Mar&quot;,&quot;Apr&quot;,&quot;May&quot;,&quot;Jun&quot;,&quot;Jul&quot;,&quot;Aug&quot;],&quot;series&quot;:[{&quot;name&quot;:&quot;{{Line 1 label}}&quot;,&quot;values&quot;:[52,60,56,72,80,76,88,96]},{&quot;name&quot;:&quot;{{Line 2 label}}&quot;,&quot;values&quot;:[36,44,48,52,60,64,68,76]}],&quot;type&quot;:&quot;line&quot;,&quot;unit&quot;:&quot;{{Unit}}&quot;}">
      <rect width="100%" height="100%" fill="#f5f4ed"/>
      <line x1="60" y1="320" x2="620" y2="320" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="324" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">0</text>
      <line x1="60" y1="264" x2="620" y2="264" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="268" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">20</text>
      <line x1="60" y1="208" x2="620" y2="208" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="212" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">40</text>
      <line x1="60" y1="152" x2="620" y2="152" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="156" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">60</text>
      <line x1="60" y1="96" x2="620" y2="96" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="100" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">80</text>
      <line x1="60" y1="40" x2="620" y2="40" stroke="#e8e7e1" stroke-width="0.8"/>

      <line x1="220" y1="40" x2="220" y2="320" stroke="#e8e7e1" stroke-width="0.5" stroke-dasharray="3 4"/>
      <line x1="300" y1="40" x2="300" y2="320" stroke="#e8e7e1" stroke-width="0.5" stroke-dasharray="3 4"/>
      <line x1="380" y1="40" x2="380" y2="320" stroke="#e8e7e1" stroke-width="0.5" stroke-dasharray="3 4"/>
      <line x1="460" y1="40" x2="460" y2="320" stroke="#e8e7e1" stroke-width="0.5" stroke-dasharray="3 4"/>
      <line x1="540" y1="40" x2="540" y2="320" stroke="#e8e7e1" stroke-width="0.5" stroke-dasharray="3 4"/>
      <line x1="60" y1="320" x2="620" y2="320" stroke="#141413" stroke-width="0.8"/>
      <polyline points="60,174.4 140,152 220,163.2 300,118.4 380,96 460,107.2 540,73.6 620,51.2" fill="none" stroke="#1B365D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="60" cy="174.4" r="4" fill="#1B365D" stroke="#f5f4ed" stroke-width="1.5"/>
      <circle cx="140" cy="152" r="4" fill="#1B365D" stroke="#f5f4ed" stroke-width="1.5"/>
      <circle cx="220" cy="163.2" r="4" fill="#1B365D" stroke="#f5f4ed" stroke-width="1.5"/>
      <circle cx="300" cy="118.4" r="4" fill="#1B365D" stroke="#f5f4ed" stroke-width="1.5"/>
      <circle cx="380" cy="96" r="4" fill="#1B365D" stroke="#f5f4ed" stroke-width="1.5"/>
      <circle cx="460" cy="107.2" r="4" fill="#1B365D" stroke="#f5f4ed" stroke-width="1.5"/>
      <circle cx="540" cy="73.6" r="4" fill="#1B365D" stroke="#f5f4ed" stroke-width="1.5"/>
      <circle cx="620" cy="51.2" r="5.5" fill="#1B365D" stroke="#f5f4ed" stroke-width="1.5"/>
      <polyline points="60,219.2 140,196.8 220,185.6 300,174.4 380,152 460,140.8 540,129.6 620,107.2" fill="none" stroke="#504e49" stroke-width="1.5" stroke-dasharray="5 3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="60" cy="219.2" r="3.5" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>
      <circle cx="140" cy="196.8" r="3.5" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>
      <circle cx="220" cy="185.6" r="3.5" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>
      <circle cx="300" cy="174.4" r="3.5" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>
      <circle cx="380" cy="152" r="3.5" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>
      <circle cx="460" cy="140.8" r="3.5" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>
      <circle cx="540" cy="129.6" r="3.5" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>
      <circle cx="620" cy="107.2" r="3.5" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>
      <text x="628" y="55.2" fill="#1B365D" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" font-weight="500">96</text>
      <text x="628" y="111.2" fill="#504e49" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">76</text>
      <text x="60" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">Jan</text>
      <text x="140" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">Feb</text>
      <text x="220" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">Mar</text>
      <text x="300" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">Apr</text>
      <text x="380" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">May</text>
      <text x="460" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">Jun</text>
      <text x="540" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">Jul</text>
      <text x="620" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">Aug</text>
      <line x1="60" y1="368" x2="620" y2="368" stroke="#e8e7e1" stroke-width="0.8"/>
      <line x1="60" y1="386" x2="84" y2="386" stroke="#1B365D" stroke-width="2" stroke-linecap="round"/>
      <circle cx="72" cy="386" r="3.5" fill="#1B365D"/>
      <text x="92" y="390" fill="#504e49" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Line 1 label}}</text>
      <line x1="213.6" y1="386" x2="237.6" y2="386" stroke="#504e49" stroke-width="1.5" stroke-dasharray="5 3" stroke-linecap="round"/>
      <circle cx="225.6" cy="386" r="3" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>
      <text x="245.6" y="390" fill="#504e49" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Line 2 label}}</text>
    </svg>

    <p class="caption">{{Caption text. The ink-blue line carries the primary trend argument. State what the trend means, not what was plotted.}}</p>
  </div>
</body>
</html>
