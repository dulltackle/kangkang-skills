<!DOCTYPE html>
<!-- ==================================================================
     DIAGRAM · Bar Chart (kami palette)
     Grouped bar chart for categorical comparison (revenue, market share, etc.)
     Up to 8 categories × 3 series. Demo: 4 quarters × 2 series.
     The <svg> below is generated by scripts/chart.py from the spec in its
     data-kami-spec attribute. To fill it, write the data as a spec and run
     `python3 scripts/build.py --chart spec.json -o chart.svg`; never edit
     coordinates by hand (--check-charts compares the marks to the spec).
     ================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bar Chart · kami diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment:    #f5f4ed;
    --ivory:        #faf9f5;
    --near-black:   #141413;
    --olive:        #504e49;
    --stone:        #6b6a64;
    --brand:        #1B365D;
    --brand-tint:   #EEF2F7;
    --border:       #e8e6dc;

    --serif: Charter, Georgia, Palatino, serif;
    --sans: var(--serif);
    --mono:  "JetBrains Mono", "SF Mono", Consolas, "TsangerJinKai02", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", monospace;
  }

  /* Poster-size page so WeasyPrint exports the full diagram without
     A4 clipping; browsers ignore @page. */
  @page { size: 1000px 960px; margin: 0; }

  body {
    font-family: var(--sans);
    background: var(--parchment);
    color: var(--near-black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 920px; width: 100%; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 500;
    letter-spacing: -0.3pt;
    line-height: 1.15;
    margin-bottom: 1.6rem;
  }

  svg { width: 100%; min-width: 640px; display: block; }

  .caption {
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--olive);
    margin-top: 1rem;
    max-width: 52ch;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar Chart · kami diagram</p>
    <h1>{{Chart Title}}</h1>

    <svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" data-kami-chart="bar" data-kami-spec="{&quot;categories&quot;:[&quot;2021&quot;,&quot;2022&quot;,&quot;2023&quot;,&quot;2024&quot;],&quot;series&quot;:[{&quot;name&quot;:&quot;{{Series A label}}&quot;,&quot;values&quot;:[44,60,72,88]},{&quot;name&quot;:&quot;{{Series B label}}&quot;,&quot;values&quot;:[32,48,64,76]}],&quot;type&quot;:&quot;bar&quot;,&quot;unit&quot;:&quot;{{Unit}}&quot;}">
      <rect width="100%" height="100%" fill="#f5f4ed"/>
      <line x1="60" y1="320" x2="620" y2="320" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="324" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">0</text>
      <line x1="60" y1="264" x2="620" y2="264" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="268" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">20</text>
      <line x1="60" y1="208" x2="620" y2="208" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="212" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">40</text>
      <line x1="60" y1="152" x2="620" y2="152" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="156" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">60</text>
      <line x1="60" y1="96" x2="620" y2="96" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="100" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">80</text>
      <line x1="60" y1="40" x2="620" y2="40" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="52" y="44" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">100</text>
      <text x="16" y="180" fill="#6b6a64" font-size="9" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" transform="rotate(-90 16 180)">{{Unit}}</text>
      <line x1="60" y1="320" x2="620" y2="320" stroke="#141413" stroke-width="0.8"/>
      <rect x="94" y="196.8" width="32" height="123.2" fill="#1B365D" rx="2"/>
      <text x="110" y="192.8" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">44</text>
      <rect x="134" y="230.4" width="32" height="89.6" fill="#504e49" rx="2"/>
      <text x="150" y="226.4" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">32</text>
      <text x="130" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">2021</text>
      <rect x="234" y="152" width="32" height="168" fill="#1B365D" rx="2"/>
      <text x="250" y="148" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">60</text>
      <rect x="274" y="185.6" width="32" height="134.4" fill="#504e49" rx="2"/>
      <text x="290" y="181.6" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">48</text>
      <text x="270" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">2022</text>
      <rect x="374" y="118.4" width="32" height="201.6" fill="#1B365D" rx="2"/>
      <text x="390" y="114.4" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">72</text>
      <rect x="414" y="140.8" width="32" height="179.2" fill="#504e49" rx="2"/>
      <text x="430" y="136.8" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">64</text>
      <text x="410" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">2023</text>
      <rect x="514" y="73.6" width="32" height="246.4" fill="#1B365D" rx="2"/>
      <text x="530" y="69.6" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">88</text>
      <rect x="554" y="107.2" width="32" height="212.8" fill="#504e49" rx="2"/>
      <text x="570" y="103.2" fill="#141413" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">76</text>
      <text x="550" y="340" fill="#141413" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">2024</text>
      <line x1="60" y1="368" x2="620" y2="368" stroke="#e8e7e1" stroke-width="0.8"/>
      <rect x="60" y="380" width="12" height="12" fill="#1B365D" rx="2"/>
      <text x="78" y="391" fill="#504e49" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Series A label}}</text>
      <rect x="210.8" y="380" width="12" height="12" fill="#504e49" rx="2"/>
      <text x="228.8" y="391" fill="#504e49" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Series B label}}</text>
    </svg>

    <p class="caption">{{Caption text. The focal series in ink-blue carries the primary argument. State the takeaway here, not a description of what is plotted.}}</p>
  </div>
</body>
</html>
