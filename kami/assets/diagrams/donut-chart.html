<!DOCTYPE html>
<!-- ==================================================================
     DIAGRAM · Donut Chart (kami palette)
     Proportional distribution (spend breakdown, user segments, etc.)
     Up to 6 segments. Demo: 6-segment revenue mix.
     The <svg> below is generated by scripts/chart.py from the spec in its
     data-kami-spec attribute. To fill it, write the data as a spec and run
     `python3 scripts/build.py --chart spec.json -o chart.svg`; never edit
     coordinates by hand (--check-charts compares the marks to the spec).
     ================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Donut Chart · kami diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment:    #f5f4ed;
    --ivory:        #faf9f5;
    --near-black:   #141413;
    --olive:        #504e49;
    --stone:        #6b6a64;
    --brand:        #1B365D;
    --brand-tint:   #EEF2F7;
    --border:       #e8e6dc;

    --serif: Charter, Georgia, Palatino, serif;
    --sans: var(--serif);
    --mono:  "JetBrains Mono", "SF Mono", Consolas, "TsangerJinKai02", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", monospace;
  }

  /* Poster-size page so WeasyPrint exports the full diagram without
     A4 clipping; browsers ignore @page. */
  @page { size: 1000px 960px; margin: 0; }

  body {
    font-family: var(--sans);
    background: var(--parchment);
    color: var(--near-black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 920px; width: 100%; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 500;
    letter-spacing: -0.3pt;
    line-height: 1.15;
    margin-bottom: 1.6rem;
  }

  svg { width: 100%; min-width: 640px; display: block; }

  .caption {
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--olive);
    margin-top: 1rem;
    max-width: 52ch;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Donut Chart · kami diagram</p>
    <h1>{{Chart Title}}</h1>

    <svg viewBox="0 0 680 404" xmlns="http://www.w3.org/2000/svg" role="img" data-kami-chart="donut" data-kami-spec="{&quot;center_label&quot;:&quot;{{Center label}}&quot;,&quot;items&quot;:[{&quot;label&quot;:&quot;{{Category A}}&quot;,&quot;value&quot;:32},{&quot;label&quot;:&quot;{{Category B}}&quot;,&quot;value&quot;:24},{&quot;label&quot;:&quot;{{Category C}}&quot;,&quot;value&quot;:18},{&quot;label&quot;:&quot;{{Category D}}&quot;,&quot;value&quot;:12},{&quot;label&quot;:&quot;{{Category E}}&quot;,&quot;value&quot;:8},{&quot;label&quot;:&quot;{{Category F}}&quot;,&quot;value&quot;:6}],&quot;source&quot;:&quot;{{Source / period}}&quot;,&quot;type&quot;:&quot;donut&quot;}">
      <rect width="100%" height="100%" fill="#f5f4ed"/>
      <path d="M 300 64 A 136 136 0 0 1 423.1 257.9 L 368.8 232.4 A 76 76 0 0 0 300 124 Z" fill="#1B365D"/>
      <path d="M 423.1 257.9 A 136 136 0 0 1 249.9 326.4 L 272 270.7 A 76 76 0 0 0 368.8 232.4 Z" fill="#504e49"/>
      <path d="M 249.9 326.4 A 136 136 0 0 1 164.3 208.5 L 224.1 204.8 A 76 76 0 0 0 272 270.7 Z" fill="#6b6a64"/>
      <path d="M 164.3 208.5 A 136 136 0 0 1 195.2 113.3 L 241.4 151.6 A 76 76 0 0 0 224.1 204.8 Z" fill="#b8b7b0"/>
      <path d="M 195.2 113.3 A 136 136 0 0 1 249.9 73.6 L 272 129.3 A 76 76 0 0 0 241.4 151.6 Z" fill="#d4d3cd"/>
      <path d="M 249.9 73.6 A 136 136 0 0 1 300 64 L 300 124 A 76 76 0 0 0 272 129.3 Z" fill="#EEF2F7" stroke="#e8e7e1" stroke-width="0.8"/>
      <circle cx="300" cy="200" r="136" fill="none" stroke="#f5f4ed" stroke-width="1.5"/>
      <circle cx="300" cy="200" r="76" fill="none" stroke="#f5f4ed" stroke-width="1.5"/>
      <text x="300" y="193" fill="#1B365D" font-size="26" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">32%</text>
      <text x="300" y="214" fill="#6b6a64" font-size="10" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Center label}}</text>
      <line x1="460" y1="120" x2="460" y2="300" stroke="#e8e7e1" stroke-width="0.8"/>
      <rect x="472" y="136" width="12" height="12" fill="#1B365D" rx="2"/>
      <text x="492" y="147" fill="#141413" font-size="9.5" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" font-weight="500">32%</text>
      <text x="536" y="147" fill="#504e49" font-size="9" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category A}}</text>
      <rect x="472" y="160" width="12" height="12" fill="#504e49" rx="2"/>
      <text x="492" y="171" fill="#141413" font-size="9.5" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">24%</text>
      <text x="536" y="171" fill="#504e49" font-size="9" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category B}}</text>
      <rect x="472" y="184" width="12" height="12" fill="#6b6a64" rx="2"/>
      <text x="492" y="195" fill="#141413" font-size="9.5" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">18%</text>
      <text x="536" y="195" fill="#504e49" font-size="9" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category C}}</text>
      <rect x="472" y="208" width="12" height="12" fill="#b8b7b0" rx="2"/>
      <text x="492" y="219" fill="#141413" font-size="9.5" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">12%</text>
      <text x="536" y="219" fill="#504e49" font-size="9" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category D}}</text>
      <rect x="472" y="232" width="12" height="12" fill="#d4d3cd" rx="2"/>
      <text x="492" y="243" fill="#141413" font-size="9.5" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">8%</text>
      <text x="536" y="243" fill="#504e49" font-size="9" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category E}}</text>
      <rect x="472" y="256" width="12" height="12" fill="#EEF2F7" stroke="#e8e7e1" stroke-width="0.8" rx="2"/>
      <text x="492" y="267" fill="#141413" font-size="9.5" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">6%</text>
      <text x="536" y="267" fill="#504e49" font-size="9" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category F}}</text>
      <line x1="60" y1="368" x2="620" y2="368" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="60" y="388" fill="#6b6a64" font-size="9" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Source / period}}</text>
    </svg>

    <p class="caption">{{Caption text. The ink-blue segment is the focal category. Lead with the insight, not the breakdown.}}</p>
  </div>
</body>
</html>
